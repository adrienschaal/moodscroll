[project]
name = "moodscroll"
version = "1.0.0"
description = "Turn the videos you saved into notes you will actually reread. Local Whisper and Apple Vision OCR, Claude for the write-up."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.4.0",
    "fastapi>=0.162.0",
    "mcp>=2.3.0",
    "mlx-whisper>=0.4.3",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
moodscroll = "moodscroll.cli:main"
moodscroll-mcp = "moodscroll.mcp_server:main"
moodscroll-web = "moodscroll.web:main"
moodscroll-setup = "moodscroll.setup_mac:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
